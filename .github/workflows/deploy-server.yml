name: server 배포 (Cloud Run)

# 2026-09-21 v4.7.0 수집 서버를 Cloud Run 에 올린다.
#
# **먼저 해 둘 것** (docs/OPERATIONS.md §16)
#   ① GCP 예산 알림을 $1 로 걸어 둔다 — 이 단계를 건너뛰고 배포하지 않는다
#   ② Neon 프로젝트를 만들고 DATABASE_URL 을 시크릿에 넣는다
#   ③ 서비스 계정에 roles/run.admin · roles/iam.serviceAccountUser · roles/artifactregistry.writer
#
# 저장소 시크릿: GCP_PROJECT_ID · GCP_SA_KEY · DATABASE_URL · ADMIN_TOKEN
#              JWT_SECRET · ROOT_EMAIL · GOOGLE_CLIENT_ID · GOOGLE_CLIENT_SECRET (v5 Phase 4)
#
# 더 나은 길 둘 (지금은 시작을 단순하게 두려고 안 썼다)
#   · 서비스 계정 키 대신 **Workload Identity Federation** — 키를 저장소에 두지 않는다
#   · 환경변수 대신 **Secret Manager** (`--set-secrets`) — 비밀이 배포 명령줄에 안 실린다
on:
  push:
    branches: [deploy]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

env:
  SERVICE: moncamp-api
  REGION: asia-northeast3   # 서울. 사용자가 거의 한국이라 왕복이 짧다

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # **시크릿이 없으면 조용히 끝낸다.** 이 워크플로는 deploy 브랜치 push 를 타는데,
      # GCP 설정 전에는 그 push 마다 빨간 줄이 하나씩 남는다 — 진짜 고장과 구별이 안 된다.
      # 설정을 안 한 것은 고장이 아니라 아직 안 한 것이다 (docs/OPERATIONS.md §16 의 순서)
      - name: 설정됐는지 본다
        id: ready
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          KEY: ${{ secrets.GCP_SA_KEY }}
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$PROJECT" ] && [ -n "$KEY" ] && [ -n "$DB" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP·Neon 시크릿이 아직 없어 서버 배포를 건너뜁니다 (docs/OPERATIONS.md §16)"
          fi

      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: steps.ready.outputs.go == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: steps.ready.outputs.go == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - if: steps.ready.outputs.go == 'true'
        name: Artifact Registry 로그인
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - if: steps.ready.outputs.go == 'true'
        name: 이미지 빌드·올리기
        run: |
          set -e
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/moncamp/${SERVICE}:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" server
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # **--min-instances 를 0 으로 둔다.** 이 서비스는 99.9% 의 시간을 놀고 있고,
      # 1 로 올리는 순간 무료 구간을 벗어난다. 콜드 스타트 3초는 여기서 아무도 안 기다린다 —
      # 수집은 답을 안 기다리고(fire-and-forget), 순위는 빌드가 받아 간다
      - if: steps.ready.outputs.go == 'true'
        name: Cloud Run 에 올리기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ROOT_EMAIL: ${{ secrets.ROOT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -e
          # **--set-env-vars 를 여러 번 적으면 마지막 것만 남는다.** 한 번에 넘겨야 한다.
          # 값에 쉼표가 들어가므로(ALLOWED_ORIGINS) 구분자를 ^##^ 로 바꿔 준다 — gcloud 의 정식 문법이다
          ENV_VARS="^##^NODE_ENV=production"
          ENV_VARS="$ENV_VARS##ALLOWED_ORIGINS=https://moncamp.kr,https://dev.moncamp.kr"
          ENV_VARS="$ENV_VARS##DATABASE_URL=$DATABASE_URL"
          # 비어 있어도 된다 — 서버가 DATABASE_URL 에서 만든다 (server/src/env.ts)
          [ -n "$DATABASE_URL_POOLED" ] && ENV_VARS="$ENV_VARS##DATABASE_URL_POOLED=$DATABASE_URL_POOLED"
          ENV_VARS="$ENV_VARS##ADMIN_TOKEN=$ADMIN_TOKEN"
          # v5 Phase 4 — 로그인. 서버가 이것 없이 뜨면 부팅에서 죽는다(server/src/env.ts)
          ENV_VARS="$ENV_VARS##JWT_SECRET=$JWT_SECRET"
          ENV_VARS="$ENV_VARS##ROOT_EMAIL=$ROOT_EMAIL"
          ENV_VARS="$ENV_VARS##GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
          ENV_VARS="$ENV_VARS##GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          ENV_VARS="$ENV_VARS##OAUTH_REDIRECT_URI=https://api.moncamp.kr/v1/auth/google/callback"
          ENV_VARS="$ENV_VARS##APP_ORIGIN=https://moncamp.kr"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 256Mi \
            --cpu 1 \
            --concurrency 40 \
            --timeout 30s \
            --set-env-vars "$ENV_VARS" \
            --quiet

      # 올라간 판이 실제로 답하는지 본다 — 안 보면 '배포는 성공했는데 죽어 있는' 상태를 모른다
      - if: steps.ready.outputs.go == 'true'
        name: 살아 있는지 확인
        run: |
          set -e
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          echo "배포: $URL"
          for i in 1 2 3 4 5; do
            code="$(curl -so /dev/null -w '%{http_code}' "$URL/healthz" || true)"
            [ "$code" = "200" ] && echo "healthz 200" && exit 0
            echo "healthz $code — 다시 (${i}/5)"
            sleep 5
          done
          echo "healthz 가 200 을 안 준다 — DB 접속(DATABASE_URL)부터 확인한다"
          exit 1
