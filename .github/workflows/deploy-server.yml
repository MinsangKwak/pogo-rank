name: server 배포 (Cloud Run)

# 2026-09-21 v4.7.0 수집 서버를 Cloud Run 에 올린다.
#
# **먼저 해 둘 것** (docs/OPERATIONS.md §16)
#   ① GCP 예산 알림을 $1 로 걸어 둔다 — 이 단계를 건너뛰고 배포하지 않는다
#   ② Neon 프로젝트를 만들고 DATABASE_URL 을 시크릿에 넣는다
#   ③ 서비스 계정에 roles/run.admin · roles/iam.serviceAccountUser · roles/artifactregistry.writer
#
# 저장소 시크릿: DATABASE_URL · ADMIN_TOKEN
#              JWT_SECRET · ROOT_EMAIL · GOOGLE_CLIENT_ID · GOOGLE_CLIENT_SECRET (v5 Phase 4)
#              CLOUDFLARE_API_TOKEN — api.moncamp.kr 을 잇는 Worker (v5 Phase 7, infra/api-proxy)
#
# 더 나은 길 둘 (지금은 시작을 단순하게 두려고 안 썼다)
#   · 서비스 계정 키 대신 **Workload Identity Federation** — 키를 저장소에 두지 않는다
#   · 환경변수 대신 **Secret Manager** (`--set-secrets`) — 비밀이 배포 명령줄에 안 실린다
on:
  push:
    branches: [deploy]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

# **열쇠 없이 GCP 에 들어간다** (Workload Identity, 2026-09-23). GitHub 이 이 실행에 준 짧은 신분증을
# GCP 가 받아 준다 — 이 저장소(MinsangKwak/pogo-rank)에서 온 것만. 새어 나갈 열쇠 파일이 없다.
# 아래 셋은 비밀이 아니라 이름표다 — 이 저장소 밖에서는 아무것도 못 한다. 만든 곳: scripts/gcp_setup.sh
permissions:
  contents: read
  id-token: write   # GitHub 에게 신분증을 받는 권한 — 없으면 GCP 로그인이 안 된다

env:
  SERVICE: moncamp-api
  REGION: asia-northeast3   # 서울. 사용자가 거의 한국이라 왕복이 짧다
  GCP_PROJECT: moncamp-api-23767
  GCP_PROVIDER: projects/930214645157/locations/global/workloadIdentityPools/github/providers/github
  GCP_SA: github-deployer@moncamp-api-23767.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # **시크릿이 없으면 조용히 끝낸다.** 이 워크플로는 deploy 브랜치 push 를 타는데,
      # GCP 설정 전에는 그 push 마다 빨간 줄이 하나씩 남는다 — 진짜 고장과 구별이 안 된다.
      # 설정을 안 한 것은 고장이 아니라 아직 안 한 것이다 (docs/OPERATIONS.md §16 의 순서)
      - name: 설정됐는지 본다
        id: ready
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DB" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL 이 없어 서버 배포를 건너뜁니다 (docs/OPERATIONS.md §16)"
          fi

      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: steps.ready.outputs.go == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.GCP_PROVIDER }}
          service_account: ${{ env.GCP_SA }}

      - if: steps.ready.outputs.go == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - if: steps.ready.outputs.go == 'true'
        name: Artifact Registry 로그인
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - if: steps.ready.outputs.go == 'true'
        name: 이미지 빌드·올리기
        run: |
          set -e
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT}/moncamp/${SERVICE}:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" server
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # **--min-instances 를 0 으로 둔다.** 이 서비스는 99.9% 의 시간을 놀고 있고,
      # 1 로 올리는 순간 무료 구간을 벗어난다. 콜드 스타트 3초는 여기서 아무도 안 기다린다 —
      # 수집은 답을 안 기다리고(fire-and-forget), 순위는 빌드가 받아 간다
      - if: steps.ready.outputs.go == 'true'
        name: Cloud Run 에 올리기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ROOT_EMAIL: ${{ secrets.ROOT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -e
          # **--set-env-vars 를 여러 번 적으면 마지막 것만 남는다.** 한 번에 넘겨야 한다.
          # 값에 쉼표가 들어가므로(ALLOWED_ORIGINS) 구분자를 ^##^ 로 바꿔 준다 — gcloud 의 정식 문법이다
          ENV_VARS="^##^NODE_ENV=production"
          ENV_VARS="$ENV_VARS##ALLOWED_ORIGINS=https://moncamp.kr,https://dev.moncamp.kr"
          ENV_VARS="$ENV_VARS##DATABASE_URL=$DATABASE_URL"
          # 비어 있어도 된다 — 서버가 DATABASE_URL 에서 만든다 (server/src/env.ts)
          [ -n "$DATABASE_URL_POOLED" ] && ENV_VARS="$ENV_VARS##DATABASE_URL_POOLED=$DATABASE_URL_POOLED"
          ENV_VARS="$ENV_VARS##ADMIN_TOKEN=$ADMIN_TOKEN"
          # v5 Phase 4 — 로그인. 서버가 이것 없이 뜨면 부팅에서 죽는다(server/src/env.ts)
          ENV_VARS="$ENV_VARS##JWT_SECRET=$JWT_SECRET"
          ENV_VARS="$ENV_VARS##ROOT_EMAIL=$ROOT_EMAIL"
          ENV_VARS="$ENV_VARS##GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
          ENV_VARS="$ENV_VARS##GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          ENV_VARS="$ENV_VARS##OAUTH_REDIRECT_URI=https://api.moncamp.kr/v1/auth/google/callback"
          ENV_VARS="$ENV_VARS##APP_ORIGIN=https://moncamp.kr"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 256Mi \
            --cpu 1 \
            --concurrency 40 \
            --timeout 30s \
            --set-env-vars "$ENV_VARS" \
            --quiet

      # 올라간 판이 실제로 답하는지 본다 — 안 보면 '배포는 성공했는데 죽어 있는' 상태를 모른다
      - if: steps.ready.outputs.go == 'true'
        name: 살아 있는지 확인
        run: |
          set -e
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          echo "배포: $URL"
          for i in 1 2 3 4 5; do
            code="$(curl -so /dev/null -w '%{http_code}' "$URL/health" || true)"
            [ "$code" = "200" ] && echo "health 200" && exit 0
            echo "health $code — 다시 (${i}/5)"
            sleep 5
          done
          echo "health 가 200 을 안 준다 — DB 접속(DATABASE_URL)부터 확인한다"
          exit 1

      # ── api.moncamp.kr 잇기 (v5 Phase 7) ────────────────────────────────────
      # **Cloud Run 도메인 연결을 안 쓴다.** 서울은 지원하지 않고, 지원 지역에서도 '운영에 권하지
      # 않는 미리보기' 다(공식 문서). 방침에 서울이라 적혀 있어 지역을 못 옮긴다.
      # Cloudflare Worker 가 받아 넘긴다 — 0원이고 DNS·인증서까지 Worker 가 만든다 (infra/api-proxy)
      - if: steps.ready.outputs.go == 'true'
        name: Worker 검사 — 빨가면 잇지 않는다
        run: node --test infra/api-proxy/worker.test.mjs

      - if: steps.ready.outputs.go == 'true'
        name: api.moncamp.kr → Cloud Run (Cloudflare Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          # 붙일 때 딸려 온 공백·줄바꿈을 뗀다 — 토큰에는 공백이 없다 (secrets-check.yml 과 같다)
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          # 시험용 curl 명령째 붙였어도 토큰만 고른다 (secrets-check.yml 과 같은 규칙)
          only="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -o 'cfut_[A-Za-z0-9_-]*' | head -1 || true)"
          [ -n "$only" ] && export CLOUDFLARE_API_TOKEN="$only"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 이 없어 api.moncamp.kr 을 잇지 않았습니다 — 서버는 떠 있지만 화면에서 못 부릅니다"
            exit 0
          fi
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          # 계정이 여럿이면 wrangler 가 물어보고 멈춘다 — 토큰이 보는 첫 계정을 쓴다
          export CLOUDFLARE_ACCOUNT_ID="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"][0]["id"])')"
          npx --yes wrangler@4 deploy --config infra/api-proxy/wrangler.toml --var "ORIGIN_URL:$URL"

      # **이은 것을 사람이 쓰는 주소로 잰다.** 서버가 살아 있는 것과 api.moncamp.kr 이 서버에
      # 닿는 것은 다른 일이다. 새 도메인은 인증서가 붙는 데 몇 분 걸릴 수 있어 넉넉히 기다린다
      - if: steps.ready.outputs.go == 'true'
        name: api.moncamp.kr 로 재 본다
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 0
          for i in $(seq 1 20); do
            code="$(curl -so /dev/null -w '%{http_code}' https://api.moncamp.kr/health || true)"
            [ "$code" = "200" ] && break
            # 인증서·DNS 를 기다리는 동안은 000·52x 다. 403 이 이어지면 기다려도 안 풀린다 — 바로 까닭을 본다
            [ "$code" = "403" ] && forbidden=$(( ${forbidden:-0} + 1 ))
            [ "${forbidden:-0}" -ge 3 ] && break
            echo "api.moncamp.kr/health $code — 인증서·DNS 를 기다린다 (${i}/20)"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            # **누가 막았는지 찍는다.** Cloudflare 앞단(봇 차단·방화벽)이면 cf-mitigated 나 챌린지 문서가 오고,
            # 서버가 막았으면 우리 JSON 이 온다. 고칠 자리가 전혀 다르다 (2026-09-23 첫 연결에서 403)
            curl -sS -D /tmp/h -o /tmp/b https://api.moncamp.kr/health || true
            echo "── 응답 머리 ──"; grep -iE '^(HTTP|server|cf-mitigated|cf-ray|content-type|x-powered-by):' /tmp/h || true
            echo "── 본문 앞 ──"; head -c 300 /tmp/b | tr '\n' ' '; echo
            if grep -qi '^cf-mitigated: challenge' /tmp/h; then
              echo "::error::Cloudflare 가 확인 화면을 띄운다 — Bot Fight Mode 가 켜져 있다. 끈다 (docs/INFRA.md §8 의 6번 아래)"
            fi
            echo "api.moncamp.kr 이 서버에 안 닿는다"; exit 1
          fi
          echo "api.moncamp.kr/health 200"
          # 로그인 시작이 **브라우저에게** 302 로 구글을 가리키는지 — Worker 가 따라가 버리면 여기가 200 이다
          read -r code where < <(curl -so /dev/null -w '%{http_code} %{redirect_url}' \
            'https://api.moncamp.kr/v1/auth/google/start?next=/&app=https://dev.moncamp.kr')
          echo "로그인 시작: $code → ${where%%\?*}"
          [ "$code" = "302" ] && [[ "$where" == https://accounts.google.com/* ]] \
            || { echo "로그인 시작이 구글로 안 간다 — Worker 가 리다이렉트를 따라갔거나 OAuth 값이 비었다"; exit 1; }
