name: Collect game update candidates

# 2026-09-16 v3.53.0 📢 게임 업데이트 — 공식 소식에서 **후보**를 자동으로 긁어 온다.
#
#   자동   공식 뉴스 색인·릴리스 노트를 훑어 새 글을 찾고, 한국어·영어 원문을 짝지어
#          발표일·미리보기 그림·"규칙이 바뀐 것으로 보이는 줄" 을 모아 후보 파일에 적는다.
#   사람   그 후보를 읽고 진짜 변경인지 판단해 backend/config/game_updates.json 에
#          editorialStatus=published 로 옮겨 적는다.
#
# **자동으로 게시하지 않는다.** 이 워크플로가 만드는 것은 후보 파일 하나뿐이고,
# 빌드는 published 만 싣는다 (backend/build.py load_game_updates).
# 결과는 dev 로 바로 밀지 않고 **PR 로 올린다** — 사람이 보기 전에는 아무 것도 바뀌지 않는다.
#
# 손으로 돌리기: Actions → 이 워크플로 → Run workflow (days 를 늘리면 더 과거까지)

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (21:00 UTC) — 일일 데이터 빌드(15:00 UTC)와 겹치지 않게
  workflow_dispatch:
    inputs:
      days:
        description: '며칠 전까지 훑을까'
        required: false
        default: '30'
      backfill:
        description: '과거 백필 시작일 (YYYYMMDD, 예: 20200101). 비우면 안 함'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect-game-updates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 백필은 손으로 돌릴 때만 — 웹 아카이브에 수천 건을 물으므로 매일 돌릴 일이 아니다.
      # (개발 컨테이너에서는 이그레스 정책에 막혀 403 이라 러너에서만 확인된다)
      - name: 후보·아카이브 수집
        run: |
          python3 scripts/collect_game_updates.py \
            --days "${{ github.event.inputs.days || '30' }}" \
            ${{ github.event.inputs.backfill && format('--backfill {0}', github.event.inputs.backfill) || '' }}

      # 바뀐 것이 없으면 PR 도 만들지 않는다 — 매일 빈 PR 이 쌓이면 아무도 안 본다
      - name: 바뀐 것이 있나
        id: diff
        run: |
          if git diff --quiet -- backend/config/game_update_candidates.json backend/config/game_update_archive.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "새 후보 없음"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git diff --stat -- backend/config/game_update_candidates.json backend/config/game_update_archive.json
          fi

      - name: 후보 PR 올리기
        if: steps.diff.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/game-update-candidates
          base: dev
          add-paths: |
            backend/config/game_update_candidates.json
            backend/config/game_update_archive.json
          commit-message: 'chore: 게임 업데이트 후보 갱신 (자동 수집)'
          title: '📢 게임 업데이트 후보 — 확인 필요'
          body: |
            공식 소식에서 자동으로 긁어 온 것입니다 (`scripts/collect_game_updates.py`).

            - `game_update_archive.json` — **아카이브 색인**. 제목·날짜·원문 링크와 **원문에서 따온 인용**뿐입니다.
              우리 요약이 아니라 인용이라 이대로 화면에 나갑니다(목록에 [원문 보기] 로 섭니다).
            - `game_update_candidates.json` — **기사 후보**. 빌드가 읽지 않습니다.
              기사로 내려면 `backend/config/game_updates.json` 에 `editorialStatus: "published"` 로 옮겨 적어야 합니다.

            확인할 것
            - `changeLines` 가 진짜 규칙 변경인지 (이벤트 안내면 후보에서 빼세요)
            - 전·후 값을 원문에서 확인했는지 — 모르면 `before` 를 비워 두면 '이전 값 미확인' 으로 나갑니다
            - 출처가 공식인지, 한국어·영어가 같은 변경을 가리키는지
          labels: game-updates
          delete-branch: true
