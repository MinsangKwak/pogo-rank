name: server 검사

# 2026-09-21 v4.7.0 수집 서버(server/)의 그물.
#
# **진짜 Postgres 를 띄워 돌린다.** 가짜 DB 로는 SQL 이 맞는지 알 수 없고,
# 이 서버에서 제일 중요한 규칙(사람당 한도 · 채널 격리 · KST 로 날 자르기)이 전부 SQL 안에 있다.
on:
  push:
    paths: ['server/**', '.github/workflows/server-test.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # 운영(Neon)과 같은 메이저 버전 — 로컬에서 도는 SQL 이 운영에서 안 도는 일을 줄인다
        image: postgres:18-alpine
        env:
          POSTGRES_USER: moncamp
          POSTGRES_PASSWORD: moncamp
          POSTGRES_DB: moncamp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moncamp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: 검사 (통합 포함)
        env:
          # 2026-09-22 v5 Phase 3 — DATABASE_URL 이 아니다. 그 이름은 서버가 운영에서 쓰고,
          # 스키마 검사는 drop schema 로 시작한다 (server/src/test/dbUrl.ts)
          TEST_DATABASE_URL: postgres://moncamp:moncamp@localhost:5432/moncamp_test
          # 없으면 선다 — 초록색인데 아무것도 안 본 CI 를 다시 만들지 않는다
          REQUIRE_TEST_DB: '1'
        run: npm test
      # 이미지가 실제로 서는지도 본다 — Dockerfile 이 깨진 채 병합되면 배포에서야 안다
      - name: 이미지 빌드
        run: docker build -t moncamp-server:ci .

  # ── 시크릿 모양 검사 (v5 Phase 4) ──────────────────────────────────────────
  #
  # **왜 필요한가.** GitHub 시크릿은 넣고 나면 아무도 못 되읽는다 — 사람도 우리도.
  # 그래서 오타가 배포 때까지 안 드러나고, 드러날 때는 "로그인이 안 된다" 라는
  # 증상으로만 온다. 자격증명이 틀린 것인지 코드가 틀린 것인지 구별이 안 된다.
  #
  # **값을 안 찍는다.** 길이와 앞뒤 몇 글자의 모양만 본다. 로그에 남는 것은 OK/NG 뿐이다.
  # 없는 것은 실패가 아니다(아직 안 넣은 것이다) — **있는데 모양이 틀린 것**만 세운다.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: 값을 찍지 않고 모양만 본다
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ROOT_EMAIL: ${{ secrets.ROOT_EMAIL }}
        run: |
          bad=0

          # 있는데 모양이 틀리면 세운다. 없으면 알리기만 한다
          check() {
            name="$1"; value="$2"; pattern="$3"; want="$4"
            if [ -z "$value" ]; then
              echo "::notice::$name — 아직 없습니다 ($want)"
              return
            fi
            # 앞뒤 공백·줄바꿈이 붙었는지 먼저 본다. 눈에 안 보이는데 인증이 통째로 실패한다
            trimmed="$(printf '%s' "$value" | tr -d '[:space:]')"
            if [ "${#trimmed}" -ne "${#value}" ]; then
              echo "::error::$name — 앞뒤에 공백이나 줄바꿈이 붙어 있습니다"
              bad=1; return
            fi
            if printf '%s' "$value" | grep -qE "$pattern"; then
              echo "$name — OK (${#value}자)"
            else
              echo "::error::$name — 모양이 다릅니다 ($want). 값은 안 찍습니다"
              bad=1
            fi
          }

          check GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" \
            '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$' \
            '.apps.googleusercontent.com 으로 끝나야 합니다'
          check GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET" \
            '^GOCSPX-.{10,}$' \
            'GOCSPX- 로 시작해야 합니다'
          check JWT_SECRET "$JWT_SECRET" \
            '^.{32,}$' \
            '32자 이상이어야 합니다 — openssl rand -hex 32'
          check ROOT_EMAIL "$ROOT_EMAIL" \
            '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$' \
            '이메일 모양이어야 합니다'

          # 따옴표가 값에 섞여 들어오는 것이 제일 흔한 오타다 — JSON 문법을 같이 복사한 경우
          for pair in "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"; do
            case "$pair" in
              *'"'*|*','*) echo "::error::${pair%%=*} — 따옴표나 쉼표가 값에 섞여 있습니다"; bad=1 ;;
            esac
          done

          [ "$bad" -eq 0 ] || { echo "시크릿 모양이 틀렸습니다 — 위 줄이 어느 것인지 말해 줍니다"; exit 1; }
          echo "시크릿 모양 검사 끝"
