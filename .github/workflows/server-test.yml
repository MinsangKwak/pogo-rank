name: server 검사

# 2026-09-21 v4.7.0 수집 서버(server/)의 그물.
#
# **진짜 Postgres 를 띄워 돌린다.** 가짜 DB 로는 SQL 이 맞는지 알 수 없고,
# 이 서버에서 제일 중요한 규칙(사람당 한도 · 채널 격리 · KST 로 날 자르기)이 전부 SQL 안에 있다.
on:
  push:
    paths: ['server/**', '.github/workflows/server-test.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # 운영(Neon)과 같은 메이저 버전 — 로컬에서 도는 SQL 이 운영에서 안 도는 일을 줄인다
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moncamp
          POSTGRES_PASSWORD: moncamp
          POSTGRES_DB: moncamp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moncamp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: 검사 (통합 포함)
        env:
          DATABASE_URL: postgres://moncamp:moncamp@localhost:5432/moncamp
        run: npm test
      # 이미지가 실제로 서는지도 본다 — Dockerfile 이 깨진 채 병합되면 배포에서야 안다
      - name: 이미지 빌드
        run: docker build -t moncamp-server:ci .
