name: server 검사

# 2026-09-21 v4.7.0 수집 서버(server/)의 그물.
#
# **진짜 Postgres 를 띄워 돌린다.** 가짜 DB 로는 SQL 이 맞는지 알 수 없고,
# 이 서버에서 제일 중요한 규칙(사람당 한도 · 채널 격리 · KST 로 날 자르기)이 전부 SQL 안에 있다.
on:
  push:
    paths: ['server/**', '.github/workflows/server-test.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # 운영(Neon)과 같은 메이저 버전 — 로컬에서 도는 SQL 이 운영에서 안 도는 일을 줄인다
        image: postgres:18-alpine
        env:
          POSTGRES_USER: moncamp
          POSTGRES_PASSWORD: moncamp
          POSTGRES_DB: moncamp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moncamp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: 검사 (통합 포함)
        env:
          # 2026-09-22 v5 Phase 3 — DATABASE_URL 이 아니다. 그 이름은 서버가 운영에서 쓰고,
          # 스키마 검사는 drop schema 로 시작한다 (server/src/test/dbUrl.ts)
          TEST_DATABASE_URL: postgres://moncamp:moncamp@localhost:5432/moncamp_test
          # 없으면 선다 — 초록색인데 아무것도 안 본 CI 를 다시 만들지 않는다
          REQUIRE_TEST_DB: '1'
        run: npm test
      # 이미지가 실제로 서는지도 본다 — Dockerfile 이 깨진 채 병합되면 배포에서야 안다
      - name: 이미지 빌드
        run: docker build -t moncamp-server:ci .

# 시크릿 모양 검사는 .github/workflows/secrets-check.yml 로 옮겼다 (v5 Phase 7).
# 서버 것만 보던 자리인데 Vercel·GCP 것까지 늘어, server/** 경로에 묶여 있을 이유가 없어졌다.
# 손으로 돌릴 수도 있다 (Actions 탭 → 시크릿 모양 검사 → Run workflow)
