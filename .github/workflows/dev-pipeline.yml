name: dev 파이프라인 (Vercel · Next.js)

# 2026-09-23 v5 Phase 7 — dev 채널을 Next.js 로 바꾼다.
#
# **한 벌이다. 입구가 둘이다.**
#   deploy-dev.yml    dev 에 push → 여기를 부르고 dev.moncamp.kr 까지 붙인다
#   rehearse-dev.yml  next 에서 파이프라인이 바뀌면 → 여기를 부르되 도메인은 안 건드린다
# 예행과 실제가 같은 코드여야 예행이 통과한 것이 실제도 통과한다 — 따로 짜면 둘이 어긋난다.
#
# **운영과 다른 Vercel 프로젝트다** (moncamp-dev, scripts/vercel_dev.py 머리 주석).
# 프로젝트·도메인·DNS 는 스크립트가 매번 맞춘다 — 대시보드에서 누를 것이 없다.
#
# 쓰는 시크릿: VERCEL_TOKEN · VERCEL_ORG_ID · CLOUDFLARE_API_TOKEN(도메인을 붙일 때만)
on:
  workflow_call:
    inputs:
      attach_domain:
        description: dev.moncamp.kr 을 붙이고 DNS 를 돌린다
        type: boolean
        default: false

# 권한은 부르는 쪽이 정한다 (deploy-dev.yml · rehearse-dev.yml) — 불려 가는 쪽은 올릴 수 없다
jobs:
  dev:
    runs-on: ubuntu-latest
    env:
      # **dev 채널로 굽는다.** web/.env.production 의 prod 를 덮는다 — Next.js 는 이미 있는
      # 환경변수를 .env 파일이 못 덮는다. 굽힌 뒤 robots 와 noindex 메타로 다시 확인한다
      NEXT_PUBLIC_CHANNEL: dev
      BUILD_CHANNEL: dev
    steps:
      - name: 설정됐는지 본다
        id: ready
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "::notice::Vercel 시크릿이 없어 dev 를 건너뜁니다"; fi

      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            frontend-v4/package-lock.json

      - if: steps.ready.outputs.go == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/sprites
            data/sprites-anim
          key: sprites-v1-${{ github.run_id }}
          restore-keys: sprites-v1-

      - if: steps.ready.outputs.go == 'true'
        name: 데이터 만들기 (파이썬 파이프라인, dev 채널)
        env:
          # 운영과 같은 문의처 (deploy-web.yml) — dev 에서도 방침 화면이 온전해야 먼저 본다
          CONTACT_EMAIL: kmsdevwork@knou.ac.kr
        run: |
          set -e
          pip install --quiet Pillow
          bash scripts/build.sh

      # 수집은 운영과 같은 주소로 켠다 — 주인이 2026-09-22 에 바로 켜기로 했다 (CLAUDE.md §3)
      - if: steps.ready.outputs.go == 'true'
        name: web 준비 (데이터·그림)
        env:
          COLLECT_URL: ${{ vars.COLLECT_URL || 'https://api.moncamp.kr' }}
        run: |
          set -e
          cd web
          npm ci
          npm run data
          npm run prepare-assets
          node -e "const m=require('./public/data/meta.json');
            if(!m.COLLECT_URL){console.error('meta.json 에 COLLECT_URL 이 없습니다');process.exit(1)}
            console.log('수집 주소:', m.COLLECT_URL)"

      # **도면은 서다 말아도 배포를 안 세운다** (CLAUDE.md §1-c) — 화면이 멀쩡한데 도면 때문에
      # dev 가 깜깜해지면 손해가 더 크다. STORYBOOK_BASE 가 없으면 자산이 루트 기준이라 빈 화면이다
      - if: steps.ready.outputs.go == 'true'
        name: 스토리북 (/storybook/) — 실패해도 계속
        continue-on-error: true
        env:
          STORYBOOK_BASE: /storybook/
        run: |
          set -e
          cd frontend-v4
          npm ci
          npm run build-storybook
          grep -q '/storybook/assets/' storybook-static/iframe.html || { echo "::error::/storybook/ 기준으로 안 빌드됐습니다"; exit 1; }
          grep -q 'name="robots" content="noindex' storybook-static/index.html || { echo "::error::스토리북에 noindex 메타가 없습니다"; exit 1; }
          rm -rf ../web/public/storybook
          cp -r storybook-static ../web/public/storybook
          echo "스토리북을 /storybook/ 에 얹습니다"

      - if: steps.ready.outputs.go == 'true'
        name: 검사
        run: cd web && npm test

      - if: steps.ready.outputs.go == 'true'
        name: Vercel dev 프로젝트 맞추기
        id: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: python3 scripts/vercel_dev.py project

      # 저장소 뿌리에서 부른다 — 프로젝트의 Root Directory 가 web 이다 (deploy-web.yml 과 같다).
      # --archive=tgz 는 뺄 수 없다: 파일이 5,000 개를 넘어 한도에 걸린다 (deploy-web.yml 주석)
      - if: steps.ready.outputs.go == 'true'
        name: Vercel 에 올리기
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -e
          npx --yes vercel@48 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@48 build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@48 deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN" > /tmp/url.txt
          echo "배포: $(cat /tmp/url.txt)"

      # **글자만 재면 디자인이 빠진 판도 초록이다** (deploy-web.yml 의 교훈). 내용·#root·색인 금지를 함께 본다.
      # 이 프로젝트는 로그인 벽을 꺼 두어(vercel_dev.py) 배포 고유 주소를 그대로 잴 수 있다
      - if: steps.ready.outputs.go == 'true'
        name: 올라간 판 재기
        run: |
          set -e
          URL="$(cat /tmp/url.txt)"
          check() {
            local base="$1" body=''
            for i in 1 2 3 4 5 6; do
              body="$(curl -sSL "$base/mon/25" || true)"
              printf '%s' "$body" | grep -q '피카츄' && break
              echo "  아직입니다 ($i/6)"; sleep 20
            done
            printf '%s' "$body" | grep -q '피카츄' || { echo "본문이 없습니다 — $base"; exit 1; }
            printf '%s' "$body" | grep -q 'id="root"' || { echo "#root 래퍼가 없습니다 — CSS 가 통째로 안 걸립니다"; exit 1; }
            printf '%s' "$body" | grep -q 'name="robots" content="noindex' || { echo "dev 인데 noindex 메타가 없습니다 — 운영 채널로 구워졌습니다"; exit 1; }
            curl -sS "$base/robots.txt" | grep -qi '^Disallow: /$' || { echo "dev robots 가 전면 차단본이 아닙니다"; exit 1; }
            # 보안 헤더 — 운영과 같은 설정(next.config.ts)이 dev 에서 먼저 걸리는지 본다
            heads="$(curl -sSI "$base/" | tr -d '\r' | tr 'A-Z' 'a-z')"
            for name in strict-transport-security x-content-type-options referrer-policy content-security-policy permissions-policy; do
              printf '%s' "$heads" | grep -q "^$name:" || { echo "보안 헤더 $name 이 없습니다"; exit 1; }
            done
            code="$(curl -so /dev/null -w '%{http_code}' -L "$base/storybook/")"
            echo "  /storybook/ → $code (도면은 없어도 배포를 안 세운다)"
            echo "OK — $base"
          }
          check "$URL"

      - if: steps.ready.outputs.go == 'true' && inputs.attach_domain
        name: dev.moncamp.kr 붙이기 (DNS 를 Vercel 로)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN 이 없어 dev.moncamp.kr 을 못 붙입니다"; exit 1; }
          python3 scripts/vercel_dev.py domain

      # DNS 가 퍼지고 인증서가 붙는 데 몇 분 걸린다. 넉넉히 기다리고, 그래도 안 되면 세운다
      - if: steps.ready.outputs.go == 'true' && inputs.attach_domain
        name: dev.moncamp.kr 로 재기
        run: |
          for i in $(seq 1 30); do
            body="$(curl -sSL https://dev.moncamp.kr/mon/25 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q 'id="root"' && printf '%s' "$body" | grep -q '피카츄'; then
              echo "OK — https://dev.moncamp.kr 이 새 화면을 준다"; exit 0
            fi
            echo "  DNS·인증서를 기다린다 (${i}/30)"; sleep 20
          done
          echo "dev.moncamp.kr 이 10분 안에 새 화면을 안 준다"; exit 1
