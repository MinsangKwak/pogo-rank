name: Build and deploy to GitHub Pages

# 2026-09-05 v2.7.3 브랜치 전략 — 이 워크플로는 **deploy 브랜치만** 배포한다 (https://minsangkwak.github.io/pogo-rank/).
#   dev    → deploy-dev.yml 이 pogo-rank-dev 저장소로 배포 (미리보기)
#   main   → 통합만, 배포 없음
#   deploy → 여기. main 을 deploy 에 머지하면 배포된다
# 일일 스케줄은 기본 브랜치(main)의 워크플로 정의로 돌지만, checkout 은 항상 deploy 를 받는다
on:
  push:
    branches: [deploy]
  schedule:
    - cron: '0 15 * * *'   # 매일 00:00 KST (15:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy   # 스케줄·수동 실행이 main 에서 시작되더라도 배포 대상은 항상 deploy 브랜치
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 2026-09-03 v2.0.0: 스프라이트 캐시 — 매 배포 1,100여 개 재다운로드 제거
      # 2026-09-12 v2.67.0 움직이는 그림(data/sprites-anim, 949장 51MB)도 같은 캐시에 —
      # 빼 두면 매 빌드가 51MB 를 다시 받고 없는 223종에 404 를 다시 묻는다
      - uses: actions/cache@v4
        with:
          path: |
            data/sprites
            data/sprites-anim
          key: sprites-v1-${{ github.run_id }}
          restore-keys: sprites-v1-
      # 2026-09-16 v3.47.0 직전 정상본 표 — 원본이 비거나 줄어든 날 이걸로 대체한다 (backend/guard.py).
      # 저장소에 커밋하지 않는다(1.6MB 가 매일 바뀐다). 캐시를 잃으면 폴백이 한 번 없을 뿐이고, 그때는 빌드가 멈춰 직전 배포가 남는다
      - uses: actions/cache@v4
        with:
          path: snapshot/tables
          key: tables-v1-${{ github.run_id }}
          restore-keys: tables-v1-
      - name: Build site
        # 2026-09-05 v2.8.0 운영 설정값은 Repository variables 에서 (Settings → Secrets and variables → Actions → Variables). 키 설명은 .env.example
        env:
          # 2026-09-14 v3.27.1 측정 ID 를 워크플로에 직접 적는다 — 저장소 변수 GA_ID(G-KVRX9FBNDC)는 같은 속성의 blog 스트림 것이라
          # 사이트 통계가 거기 섞여 들어갔다. 공개 식별자라(배포 HTML 에 그대로 실린다) 코드에 둬도 된다
          #
          # 2026-09-15 v3.42.1 G-8MSZM80JHZ → G-1L6ENS8PVK. 옛 스트림(15750161968)이 사라져
          # gtag/js?id=G-8MSZM80JHZ 가 404 였다 — 라이브러리가 안 받아져 히트가 한 건도 안 나갔다.
          # 지금 스트림은 moncamp(15780045801). 값을 바꿀 때는 먼저 이걸 확인한다:
          #   curl -so /dev/null -w '%{http_code}\n' "https://www.googletagmanager.com/gtag/js?id=<ID>"
          #   200 이어야 한다. 404 면 그 스트림은 없는 것이다 (아무 ID 나 넣으면 200 이 나오므로 404 는 확실한 신호다)
          GA_ID: G-1L6ENS8PVK
          ADMIN_UID: ${{ vars.ADMIN_UID }}
          CONTACT_EMAIL: kmsdevwork@knou.ac.kr   # 2026-09-15 v3.32.0 학생 계정으로 교체. 저장소 변수 vars.CONTACT_EMAIL 은 더 읽지 않는다 (v3.27.1 GA_ID 와 같은 처리)
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: bash scripts/build.sh
      # 2026-09-18 v4.0.0 **실서비스가 v4 로 바뀐다.**
      #   v3 빌드는 그대로 돈다 — v4 가 그 산출물에서 데이터(dist/data.js · dist/index.html)를 뽑아 쓰고,
      #   그림 2,000여 장과 robots·sitemap·404·build.json 도 거기서 가져온다.
      #   올리는 것만 v4 쪽으로 바뀐 것이다 (미리보기가 2026-09-17 에 먼저 이 모양이 됐다).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v4/package-lock.json
      - name: v4 빌드
        continue-on-error: true
        env:
          # 채널·측정 ID 는 finalize-html.mjs 가 읽는다 — v3 의 build.py 와 같은 규칙, 같은 값
          BUILD_CHANNEL: prod
          GA_ID: G-1L6ENS8PVK
        run: |
          set -e
          cd frontend-v4
          npm ci
          npm run build
      # 올릴 폴더를 여기서 한 벌 만든다.
      #   v4 가 서면 그것을, 서다 말면 v3 를 올린다 — **어느 쪽이든 실서비스가 깜깜해지지 않는다.**
      - name: 올릴 폴더 꾸리기 (site/)
        run: |
          set -e
          rm -rf site
          if [ -f frontend-v4/dist/index.html ]; then
            cp -r frontend-v4/dist site
            echo "v4 를 올립니다"
          else
            cp -r dist site
            echo "::warning::v4 빌드가 서서 v3 를 대신 올립니다 — frontend-v4 를 확인하세요"
          fi
          # 그림과 부속 파일은 v3 빌드가 만든 것을 그대로 쓴다 (v4 는 아직 제 것을 안 만든다)
          for keep in sprites sprites-anim robots.txt sitemap.xml 404.html build.json; do
            if [ -e "dist/$keep" ] && [ ! -e "site/$keep" ]; then cp -r "dist/$keep" "site/$keep"; fi
          done
          # **색인 허용본이 맞는지 본다.** dev 차단본이 실서비스에 실리면 검색에서 통째로 사라진다.
          #   `grep ... && { exit 1; }` 로 쓰지 않는다 — set -e 아래에서 grep 이 '못 찾음'(1)을 낼 때
          #   그 줄이 실패로 읽힐지가 셸 규칙의 예외 조항에 달려 있다. if 로 적으면 읽는 사람도 셸도 헷갈리지 않는다
          for must in site/index.html site/robots.txt; do
            test -f "$must" || { echo "::error::$must 가 없습니다"; exit 1; }
          done
          if grep -q '색인 금지' site/robots.txt; then echo "::error::robots 가 dev 차단본입니다"; exit 1; fi
          if ! grep -q '^Allow: /' site/robots.txt; then echo "::error::robots 에 Allow 가 없습니다 (운영본이 아닙니다)"; exit 1; fi
          if grep -q 'noindex' site/index.html; then echo "::error::index.html 에 noindex 가 있습니다 (dev 빌드가 실렸습니다)"; exit 1; fi
          echo "운영 robots·색인 확인"
          # 그림이 통째로 빠지면 화면이 몬스터볼 자리표시로 도배된다 — 수로 확인한다
          test "$(ls site/sprites | wc -l)" -gt 500 || { echo "::error::스프라이트가 모자랍니다"; exit 1; }
      # 2026-09-03 보조 기록용 커밋 — 실패해도 배포는 계속되도록 (예: 푸시 거부·권한 변경)
      # snapshot/ranks.json·rank_delta.json 은 빌드가 직접 쓴다 — 이 커밋이 없으면
      # 다음 실행이 직전 순위를 잃어버려 ▲▼ 변동 표시가 영영 비어 있게 된다
      - name: Commit build snapshot (시트 원본·파싱 리포트·순위 스냅샷을 저장소에 남김)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p snapshot
          cp data/sheet_*.csv data/sheet_report.txt snapshot/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot
          git diff --cached --quiet || git commit -m "chore: build snapshot [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "snapshot push 생략 (배포에는 영향 없음)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
