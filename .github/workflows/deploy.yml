name: Build and deploy to GitHub Pages

# 2026-09-05 v2.7.3 브랜치 전략 — 이 워크플로는 **deploy 브랜치만** 배포한다 (https://minsangkwak.github.io/pogo-rank/).
#   dev    → deploy-dev.yml 이 pogo-rank-dev 저장소로 배포 (미리보기)
#   main   → 통합만, 배포 없음
#   deploy → 여기. main 을 deploy 에 머지하면 배포된다
# 일일 스케줄은 기본 브랜치(main)의 워크플로 정의로 돌지만, checkout 은 항상 deploy 를 받는다
on:
  push:
    branches: [deploy]
  schedule:
    - cron: '0 15 * * *'   # 매일 00:00 KST (15:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy   # 스케줄·수동 실행이 main 에서 시작되더라도 배포 대상은 항상 deploy 브랜치
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 2026-09-03 v2.0.0: 스프라이트 캐시 — 매 배포 1,100여 개 재다운로드 제거
      - uses: actions/cache@v4
        with:
          path: data/sprites
          key: sprites-v1-${{ github.run_id }}
          restore-keys: sprites-v1-
      - name: Build site
        run: bash scripts/build.sh
      # 2026-09-03 보조 기록용 커밋 — 실패해도 배포는 계속되도록 (예: 푸시 거부·권한 변경)
      # snapshot/ranks.json·rank_delta.json 은 빌드가 직접 쓴다 — 이 커밋이 없으면
      # 다음 실행이 직전 순위를 잃어버려 ▲▼ 변동 표시가 영영 비어 있게 된다
      - name: Commit build snapshot (시트 원본·파싱 리포트·순위 스냅샷을 저장소에 남김)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p snapshot
          cp data/sheet_*.csv data/sheet_report.txt snapshot/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot
          git diff --cached --quiet || git commit -m "chore: build snapshot [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "snapshot push 생략 (배포에는 영향 없음)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
