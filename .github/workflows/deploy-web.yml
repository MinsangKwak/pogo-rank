name: web 배포 (Vercel)

# 2026-09-22 v5 Phase 7 — Next.js 앱을 Vercel 에 올린다.
#
# **왜 Vercel 이 스스로 빌드하지 않나.** 화면 데이터는 파이썬 파이프라인(backend/build.py)이
# 만든다. Vercel 의 빌드 환경에서 그것까지 돌리면 두 생태계를 한 상자에 밀어 넣는 셈이고,
# 파이썬 쪽이 깨지는 날 화면 배포까지 같이 선다.
# 여기서 만들고 **다 구운 것만** 올린다 (`vercel deploy --prebuilt`).
#
# **자격증명은 여기서 재지 마라.** 첫 배포가 `vercel pull` 에서 섰는데, Vercel 이 주는 말은
# `Could not retrieve Project Settings` 한 줄이라 토큰이 죽은 것인지 ORG/PROJECT 짝이 안 맞는
# 것인지 구별이 안 됐다 — 고칠 자리가 아주 다른데도. 그걸 알아내는 데 5분짜리 배포를 태웠다.
# `secrets-check.yml` 이 같은 호출을 10초에 돌려 둘을 갈라 말한다. 의심되면 그쪽을 먼저 돌린다.
#
# **먼저 해 둘 것** (docs/OPERATIONS.md)
#   ① vercel.com 에서 프로젝트를 만든다
#        Root Directory     web
#        Ignored Build Step `exit 0`  ← **반드시.** 안 하면 Vercel 이 push 마다 스스로
#                                        빌드를 돌리는데, 화면 데이터가 저장소에 없어 매번
#                                        실패한다. 빨간 배포가 쌓이면 진짜 고장과 구별이 안 된다
#   ② 저장소 시크릿 VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID
#
# **화면 쪽 값은 Vercel 대시보드에 안 둔다.** web/.env.production 에 있다 —
# NEXT_PUBLIC_ 값은 브라우저로 그대로 나가 숨길 수 있는 물건이 아니고, 저장소에 두면
# 배포가 커밋 하나로 재현된다. 채널마다 달라야 하면 저장소 **변수** vars.API_URL 로 덮는다
on:
  push:
    # **`next` 는 전환 기간에만 둔다.** 손으로 돌리려면(workflow_dispatch) 그 파일이 **기본
    # 브랜치에 있어야** 하는데, 이 워크플로는 아직 next 에만 있다. 그래서 push 로 돈다.
    #
    # 지금 올라가는 자리는 pogo-rank.vercel.app 이고 moncamp.kr 은 아직 GitHub Pages 다 —
    # 주소를 넘기기 전까지는 이 배포가 사람을 건드리지 않는다.
    # **전환이 끝나면 `next` 를 뺀다** (docs/V5-CUTOVER.md §5).
    branches: [deploy, next]
    paths: ['web/**', 'frontend-v4/scripts/**', 'backend/**', 'content/**', 'release/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # **시크릿이 없으면 조용히 끝낸다.** 설정 전에는 push 마다 빨간 줄이 하나씩 남는데,
      # 그것은 진짜 고장과 구별이 안 된다. 설정을 안 한 것은 고장이 아니다
      - name: 설정됐는지 본다
        id: ready
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$PROJECT" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel 시크릿이 아직 없어 web 배포를 건너뜁니다"
          fi

      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 그림은 매일 바뀌지 않는다 — 캐시가 없으면 2,000여 장을 매번 다시 줄인다
      - if: steps.ready.outputs.go == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/sprites
            data/sprites-anim
          key: sprites-v1-${{ github.run_id }}
          restore-keys: sprites-v1-

      # 저장소 변수가 있을 때만 덮는다. **빈 값으로 덮지 않는다** —
      # 비어 있으면 화면이 로그인을 통째로 끄고 뜬다 (src/lib/serverApi.ts)
      - if: steps.ready.outputs.go == 'true' && vars.API_URL != ''
        name: 서버 주소를 저장소 변수로 덮는다
        run: echo "NEXT_PUBLIC_API_URL=${{ vars.API_URL }}" >> "$GITHUB_ENV"

      - if: steps.ready.outputs.go == 'true'
        name: 데이터 만들기 (파이썬 파이프라인)
        env:
          BUILD_CHANNEL: prod
        run: |
          set -e
          pip install --quiet Pillow
          bash scripts/build.sh

      # **수집을 켠 채로 굽는다** (v5 Phase 8). 이 값이 비면 화면이 수집을 통째로 끈다 —
      # 서버가 있어도 한 건도 안 나간다 (web/src/components/CollectBridge.tsx).
      # 저장소 변수 vars.COLLECT_URL 이 있으면 그쪽이 이긴다 (채널마다 다를 수 있다)
      - if: steps.ready.outputs.go == 'true'
        name: web 준비 (데이터·그림)
        env:
          COLLECT_URL: ${{ vars.COLLECT_URL || 'https://api.moncamp.kr' }}
        run: |
          set -e
          cd web
          npm ci
          npm run data
          npm run prepare-assets
          # 켜져서 구워졌는지 눈으로 본다 — 비어 있으면 조용히 안 나간다
          node -e "const m=require('./public/data/meta.json');
            if(!m.COLLECT_URL){console.error('meta.json 에 COLLECT_URL 이 없습니다 — 수집이 꺼진 채로 구워졌습니다');process.exit(1)}
            console.log('수집 주소:', m.COLLECT_URL)"

      # **검사가 빨개지면 배포를 세운다.** 조용히 넘어가면 잘못된 판이 그대로 올라간다
      - if: steps.ready.outputs.go == 'true'
        name: 검사
        run: cd web && npm test

      # **저장소 뿌리에서 부른다.** Vercel 프로젝트의 Root Directory 가 `web` 이라
      # CLI 도 같은 자리에서 봐야 한다 — web/ 안에서 부르면 web/web 을 찾는다
      - if: steps.ready.outputs.go == 'true'
        name: Vercel 에 올리기
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npx --yes vercel@48 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@48 build --prod --token "$VERCEL_TOKEN"
          # **--archive=tgz 는 뺄 수 없다.** 한 번에 올릴 수 있는 파일이 5,000개인데
          # 이 화면은 그걸 넘는다 — 스프라이트 1,153장 + 정적 HTML 1,172장 + 청크.
          # 없이 돌렸더니 66MB 중 50MB 를 올리다 `api-upload-free` 로 끊겼다.
          # 압축본 하나로 올리면 파일 수가 1이 되어 한도를 안 탄다.
          npx --yes vercel@48 deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN" > /tmp/url.txt
          echo "배포: $(cat /tmp/url.txt)"

      # 올라간 판이 실제로 **내용이 든 HTML** 을 주는지 본다.
      # 200 만 보면 빈 껍데기가 올라가도 초록이다 — 이 판의 목적이 그 내용이므로 그것을 잰다.
      #
      # **CLI 가 찍어 주는 주소를 재지 않는다.** 그것은 배포 고유 주소이고 접근 보호가 걸려 있어,
      # 재 보면 Vercel 로그인 화면이 온다 — 실측 340KB 짜리 `<title>Login – Vercel</title>`.
      # 검사가 내 화면 대신 남의 로그인 페이지를 훑고 "본문이 없다" 고 답했다.
      # 사람이 보는 것은 운영 별칭이므로 **그쪽을 잰다.** 주소가 바뀌면 vars.SITE_URL 로 덮는다.
      #
      # 별칭이 붙는 데 몇 초 걸릴 수 있어 몇 번 다시 본다 — 한 번 보고 세우면 배포가 멀쩡한데
      # 빨개진다
      - if: steps.ready.outputs.go == 'true'
        name: 색인될 HTML 인지 확인
        env:
          SITE: ${{ vars.SITE_URL || 'https://pogo-rank.vercel.app' }}
        run: |
          set -e
          echo "배포 고유 주소: $(cat /tmp/url.txt)"
          echo "재는 주소: $SITE"
          body=''
          for i in 1 2 3 4 5 6; do
            body="$(curl -sSL "$SITE/mon/25" || true)"
            printf '%s' "$body" | grep -q '피카츄' && break
            echo "  아직입니다 ($i/6) — 20초 뒤 다시 봅니다"
            sleep 20
          done
          printf '%s' "$body" | grep -q '<title>' || { echo '제목이 없습니다'; exit 1; }
          printf '%s' "$body" | grep -q '피카츄' || { echo '본문에 포켓몬 이름이 없습니다 — 빈 껍데기가 올라갔습니다'; exit 1; }
          printf '%s' "$body" | grep -q 'application/ld+json' || { echo 'JSON-LD 가 없습니다'; exit 1; }
          # **글자만 재면 디자인이 빠진 판도 초록이다.** 실제로 그랬다 — `#root` 래퍼가 빠져
          # CSS 307군데가 죽은 채로 배포됐는데, 제목·본문·JSON-LD 가 다 있어 이 검사가 통과했다.
          # 그 자리를 여기서도 본다 (src/test/rootwrap.test.ts 와 같은 것을 지킨다)
          printf '%s' "$body" | grep -q 'id="root"' || { echo '#root 래퍼가 없습니다 — CSS 가 통째로 안 걸립니다'; exit 1; }
          echo "OK — $SITE/mon/25 가 내용이 든 HTML 을 준다"
