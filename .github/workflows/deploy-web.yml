name: web 배포 (Vercel)

# 2026-09-22 v5 Phase 7 — Next.js 앱을 Vercel 에 올린다.
#
# **왜 Vercel 이 스스로 빌드하지 않나.** 화면 데이터는 파이썬 파이프라인(backend/build.py)이
# 만든다. Vercel 의 빌드 환경에서 그것까지 돌리면 두 생태계를 한 상자에 밀어 넣는 셈이고,
# 파이썬 쪽이 깨지는 날 화면 배포까지 같이 선다.
# 여기서 만들고 **다 구운 것만** 올린다 (`vercel deploy --prebuilt`).
#
# **먼저 해 둘 것** (docs/OPERATIONS.md)
#   ① vercel.com 에서 프로젝트를 만든다 (Root Directory: web)
#   ② 저장소 시크릿 VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID
#   ③ Vercel 프로젝트 환경변수 NEXT_PUBLIC_API_URL (서버 주소)
on:
  push:
    branches: [deploy]
    paths: ['web/**', 'frontend-v4/scripts/**', 'backend/**', 'content/**', 'release/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # **시크릿이 없으면 조용히 끝낸다.** 설정 전에는 push 마다 빨간 줄이 하나씩 남는데,
      # 그것은 진짜 고장과 구별이 안 된다. 설정을 안 한 것은 고장이 아니다
      - name: 설정됐는지 본다
        id: ready
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$PROJECT" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel 시크릿이 아직 없어 web 배포를 건너뜁니다"
          fi

      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 그림은 매일 바뀌지 않는다 — 캐시가 없으면 2,000여 장을 매번 다시 줄인다
      - if: steps.ready.outputs.go == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/sprites
            data/sprites-anim
          key: sprites-v1-${{ github.run_id }}
          restore-keys: sprites-v1-

      - if: steps.ready.outputs.go == 'true'
        name: 데이터 만들기 (파이썬 파이프라인)
        env:
          BUILD_CHANNEL: prod
        run: |
          set -e
          pip install --quiet Pillow
          bash scripts/build.sh

      - if: steps.ready.outputs.go == 'true'
        name: web 준비 (데이터·그림)
        run: |
          set -e
          cd web
          npm ci
          npm run data
          npm run prepare-assets

      # **검사가 빨개지면 배포를 세운다.** 조용히 넘어가면 잘못된 판이 그대로 올라간다
      - if: steps.ready.outputs.go == 'true'
        name: 검사
        run: cd web && npm test

      - if: steps.ready.outputs.go == 'true'
        name: Vercel 에 올리기
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          cd web
          npx --yes vercel@48 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@48 build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@48 deploy --prebuilt --prod --token "$VERCEL_TOKEN" > /tmp/url.txt
          echo "배포: $(cat /tmp/url.txt)"

      # 올라간 판이 실제로 **내용이 든 HTML** 을 주는지 본다.
      # 200 만 보면 빈 껍데기가 올라가도 초록이다 — 이 판의 목적이 그 내용이므로 그것을 잰다
      - if: steps.ready.outputs.go == 'true'
        name: 색인될 HTML 인지 확인
        run: |
          set -e
          URL="$(cat /tmp/url.txt)"
          body="$(curl -sSL "$URL/mon/25")"
          echo "$body" | grep -q '<title>' || { echo '제목이 없습니다'; exit 1; }
          echo "$body" | grep -q '피카츄' || { echo '본문에 포켓몬 이름이 없습니다 — 빈 껍데기가 올라갔습니다'; exit 1; }
          echo "$body" | grep -q 'application/ld+json' || { echo 'JSON-LD 가 없습니다'; exit 1; }
          echo 'OK — /mon/25 가 내용이 든 HTML 을 준다'
