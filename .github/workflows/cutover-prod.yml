name: 운영 주소 전환 (moncamp.kr ↔ Vercel)

# 2026-09-23 v5 운영 전환 — moncamp.kr 을 GitHub Pages 에서 Vercel(pogo-rank)로 넘긴다.
#
# **손으로만 돈다.** push 로 도는 순간 주소가 오가는 일이 커밋 하나에 묶인다 — 이 일은 사람이 고른 때에 한다.
#   status    지금 DNS 만 찍는다 (아무것도 안 바꾼다) — 넘기기 전에 되돌릴 자리를 눈으로 본다
#   attach    moncamp.kr · www 를 Vercel 에 붙이고 DNS 를 돌린 뒤, 새 화면이 뜰 때까지 잰다
#   rollback  DNS 를 GitHub Pages 로 되돌리고, 옛 v4 가 뜰 때까지 잰다
#
# 쓰는 시크릿: VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID · CLOUDFLARE_API_TOKEN
on:
  workflow_dispatch:
    inputs:
      action:
        description: status · attach · rollback
        type: choice
        options: [status, attach, rollback]
        default: status

permissions:
  contents: read

# 둘이 겹치면 DNS 를 서로 덮는다
concurrency:
  group: cutover-prod
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: DNS · 도메인 (${{ inputs.action }})
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/vercel_prod.py "${{ inputs.action }}"

      # **어느 판이 떴는지는 문서가 말한다.** Next.js 는 문서에 self.__next_f 를 심고 v4 에는 없다.
      # DNS 가 퍼지고 인증서가 붙는 데 몇 분 걸린다 — 넉넉히 기다리고, 그래도 안 되면 세운다
      - if: inputs.action != 'status'
        name: moncamp.kr 로 재기
        env:
          WANT: ${{ inputs.action == 'attach' && 'next' || 'v4' }}
        run: |
          for i in $(seq 1 40); do
            body="$(curl -sSL "https://moncamp.kr/mon/25?t=$(date +%s)" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q 'id="root"'; then
              if printf '%s' "$body" | grep -q '__next_f'; then got=next; else got=v4; fi
              if [ "$got" = "$WANT" ]; then echo "OK — https://moncamp.kr 이 $got 판을 준다"; break; fi
            fi
            echo "  DNS·인증서를 기다린다 (${i}/40)"; sleep 20
          done
          [ "${got:-}" = "$WANT" ] || { echo "moncamp.kr 이 13분 안에 $WANT 판을 안 준다"; exit 1; }
          if [ "$WANT" = next ]; then
            printf '%s' "$body" | grep -q '피카츄' || { echo "본문이 없습니다"; exit 1; }
            heads="$(curl -sSI https://moncamp.kr/ | tr -d '\r' | tr 'A-Z' 'a-z')"
            for name in strict-transport-security x-content-type-options referrer-policy content-security-policy permissions-policy; do
              printf '%s' "$heads" | grep -q "^$name:" || { echo "보안 헤더 $name 이 없습니다"; exit 1; }
            done
            code="$(curl -so /dev/null -w '%{http_code}' https://www.moncamp.kr/)"
            echo "www → $code (308 이면 moncamp.kr 로 옮긴다)"
          fi
