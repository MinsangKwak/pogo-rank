name: 시크릿 모양 검사

# 2026-09-22 v5 Phase 7 — 넣은 시크릿이 제대로 들어갔는지 본다.
#
# **왜 필요한가.** GitHub 시크릿은 넣고 나면 아무도 못 되읽는다 — 사람도, 우리도.
# 그래서 오타가 배포 때까지 숨고, 드러날 때는 "로그인이 안 된다" 같은 증상으로만 온다.
# 자격증명이 틀린 것인지 코드가 틀린 것인지 구별이 안 된다.
#
# **값을 안 찍는다.** 길이와 앞뒤 모양만 본다. 로그에 남는 것은 OK/NG 뿐이다.
# `VERCEL_TOKEN` 은 길이조차 안 적는다 — 계정 전체를 조종하는 열쇠라 단서를 남기지 않는다.
#
# **없는 것은 실패가 아니다** (아직 안 넣은 것이다). **있는데 모양이 틀린 것**만 세운다.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/secrets-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 값을 찍지 않고 모양만 본다
        env:
          # 1단계 — 서버가 부팅하는 데 필요한 것
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ROOT_EMAIL: ${{ secrets.ROOT_EMAIL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          # 2단계 — 화면 배포
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # 3단계 — 서버 배포
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          # 4단계 — api.moncamp.kr · dev.moncamp.kr 잇기 (v5 Phase 7)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bad=0

          # check <이름> <값> <정규식> <기대하는 모양> [hush]
          #   hush 를 주면 길이도 안 적는다
          check() {
            name="$1"; value="$2"; pattern="$3"; want="$4"; hush="${5:-}"
            if [ -z "$value" ]; then
              echo "  ·  $name — 아직 없음 ($want)"
              return
            fi
            # 앞뒤 공백·줄바꿈부터 본다. 눈에 안 보이는데 인증이 통째로 실패한다
            trimmed="$(printf '%s' "$value" | tr -d '[:space:]')"
            if [ "${#trimmed}" -ne "${#value}" ]; then
              echo "::error::$name — 앞뒤에 공백이나 줄바꿈이 붙어 있습니다"
              bad=1; return
            fi
            case "$value" in
              *'"'*|*"'"*) echo "::error::$name — 따옴표가 값에 섞여 있습니다"; bad=1; return ;;
            esac
            if printf '%s' "$value" | grep -qE "$pattern"; then
              if [ -n "$hush" ]; then echo "  OK $name"; else echo "  OK $name (${#value}자)"; fi
            else
              echo "::error::$name — 모양이 다릅니다 ($want). 값은 안 찍습니다"
              bad=1
            fi
          }

          echo "── 1단계 · 서버가 부팅하는 데 필요한 것 ──"
          check JWT_SECRET "$JWT_SECRET" '^.{32,}$' '32자 이상 — openssl rand -hex 32'
          check ADMIN_TOKEN "$ADMIN_TOKEN" '^.{32,}$' '32자 이상 — 없으면 운영에서 서버가 부팅을 못 한다'
          check ROOT_EMAIL "$ROOT_EMAIL" '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$' '이메일 모양'
          check GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" \
            '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$' '.apps.googleusercontent.com 으로 끝난다'
          check GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET" '^GOCSPX-.{10,}$' 'GOCSPX- 로 시작한다'
          check DATABASE_URL "$DATABASE_URL" '^postgres(ql)?://' 'postgres:// 로 시작한다'
          check DATABASE_URL_POOLED "$DATABASE_URL_POOLED" '^postgres(ql)?://' 'postgres:// 로 시작한다'

          # 풀링인지 직접인지 **알려만 준다.** 서버가 알아서 고르므로 틀린 것이 아니다
          # (server/src/env.ts 의 directOf). 어느 쪽을 넣었는지 사람이 못 보니 여기서 말해 준다
          if [ -n "$DATABASE_URL" ]; then
            case "$DATABASE_URL" in
              *-pooler.*) echo "     ↳ DATABASE_URL 은 풀링 주소입니다 — 마이그레이션은 서버가 직접 주소로 바꿔 씁니다" ;;
              *)          echo "     ↳ DATABASE_URL 은 직접 주소입니다" ;;
            esac
          fi

          echo "── 2단계 · 화면 배포 (Vercel) ──"
          # **글자 종류를 못 박지 않는다.** 처음에는 '영숫자 20자 이상' 을 요구했는데,
          # 그러면 값이 틀린 것인지 **내 검사가 좁은 것인지** 구별이 안 된다 — 멀쩡한 값에
          # 빨간 줄이 뜨면 사람이 맞게 한 일을 다시 하게 된다.
          #
          # 그래서 둘을 갈라 말한다: 짧으면 잘려 붙은 것이고(진짜 실수), 긴데 낯선 글자가
          # 섞였으면 형식이 바뀐 것이다(내가 따라가면 된다). 길이는 여전히 안 적는다 —
          # 계정 전체를 조종하는 열쇠라 단서를 남기지 않는다
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "  ·  VERCEL_TOKEN — 아직 없음"
          elif [ "$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]' | wc -c)" -ne "$(printf '%s' "$VERCEL_TOKEN" | wc -c)" ]; then
            echo "::error::VERCEL_TOKEN — 앞뒤에 공백이나 줄바꿈이 붙어 있습니다"
            bad=1
          elif printf '%s' "$VERCEL_TOKEN" | grep -qE '^.{20,}$'; then
            if printf '%s' "$VERCEL_TOKEN" | grep -qE '^[A-Za-z0-9]+$'; then
              echo "  OK VERCEL_TOKEN"
            else
              # 세우지 않는다 — 길이는 멀쩡하다. Vercel 이 형식을 바꿨을 수 있다
              echo "::warning::VERCEL_TOKEN — 길이는 멀쩡한데 영숫자 밖의 글자가 섞여 있습니다. 형식이 바뀐 것일 수 있어 세우지는 않습니다"
              echo "  OK? VERCEL_TOKEN (길이는 맞음)"
            fi
          else
            echo "::error::VERCEL_TOKEN — 너무 짧습니다. 복사하다 잘린 것 같습니다"
            bad=1
          fi
          check VERCEL_ORG_ID "$VERCEL_ORG_ID" '^(team|user)_[A-Za-z0-9]+$' 'team_ 또는 user_ 로 시작한다'
          check VERCEL_PROJECT_ID "$VERCEL_PROJECT_ID" '^prj_[A-Za-z0-9]+$' 'prj_ 로 시작한다'

          echo "── 3단계 · 서버 배포 (Cloud Run) ──"
          # 2026-09-23 열쇠 없는 로그인(Workload Identity)으로 바꿨다 — 두 칸은 이제 쓰지 않는다.
          # 프로젝트·공급자·서비스 계정은 이름표라 deploy-server.yml 에 그대로 적혀 있다
          echo "  ─  GCP_PROJECT_ID · GCP_SA_KEY — 쓰지 않음 (Workload Identity, deploy-server.yml)"

          echo "── 4단계 · 주소 잇기 (Cloudflare) ──"
          # 모양은 못 박지 않는다 — 형식이 공개돼 있지 않다. 대신 아래에서 실제로 물어본다
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "  ·  CLOUDFLARE_API_TOKEN — 아직 없음"
          else
            # 폰에서 붙이면 끝에 줄바꿈이 딸려 온다 (2026-09-23 실제로 그랬다). 토큰에는 공백이 없으므로
            # **떼고 쓴다** — 쓰는 쪽(deploy-server · vercel_dev.py)도 같이 뗀다. 섞였다는 사실은 알린다
            if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -q '[[:space:]]'; then
              echo "::warning::CLOUDFLARE_API_TOKEN — 공백·줄바꿈이 섞여 있어 떼고 씁니다"
              CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
            fi
            # 토큰 확인 전용 주소다 — 아무것도 바꾸지 않는다. 찍는 것은 active 여부뿐이다
            state="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c 'import sys,json;print(json.load(sys.stdin).get("result",{}).get("status","?"))' 2>/dev/null)"
            if [ "$state" = "active" ]; then echo "  OK CLOUDFLARE_API_TOKEN (Cloudflare 가 active 라고 답함)"
            else echo "::error::CLOUDFLARE_API_TOKEN — Cloudflare 가 받지 않습니다 (상태: ${state:-응답 없음})"; bad=1; fi
          fi

          echo
          [ "$bad" -eq 0 ] || { echo "모양이 틀린 것이 있습니다 — 위에서 ::error:: 로 표시된 줄입니다"; exit 1; }
          echo "모양이 틀린 것은 없습니다"

      # **모양이 맞아도 짝이 틀릴 수 있다.** 셋 다 생긴 건 멀쩡한데 배포가
      # `Could not retrieve Project Settings` 로 섰다 — 토큰이 보는 계정과 ORG/PROJECT 가
      # 다른 곳이면 모양 검사로는 안 잡힌다. 그래서 **실제로 접속해 본다.**
      #
      # 배포와 **같은 호출**(`vercel pull`)을 쓴다. 잣대가 두 벌이면 여기만 통과한다.
      # 값은 안 찍는다 — 찍는 것은 토큰이 누구로 보이는지(내 계정 이름)와 성공/실패뿐이다.
      - name: Vercel 에 실제로 닿아 본다
        if: ${{ env.HAS_VERCEL == '1' }}
        env:
          HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' && '1' || '0' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "── Vercel 실접속 ──"
          who=$(npx --yes vercel@48 whoami --token "$VERCEL_TOKEN" 2>&1) || {
            echo "::error::VERCEL_TOKEN — 토큰 자체가 안 먹습니다 (만료됐거나 잘못 붙여넣었습니다)"
            echo "$who" | tail -3
            exit 1
          }
          echo "  토큰이 보는 계정: $who"

          # 빈 방에서 돌린다 — 저장소의 .vercel 이 있으면 그것이 답해서 검사가 헛돈다
          mkdir -p /tmp/vcheck && cd /tmp/vcheck
          if out=$(npx --yes vercel@48 pull --yes --environment=production --token "$VERCEL_TOKEN" 2>&1); then
            echo "  OK 프로젝트 설정을 받아왔습니다 — 배포가 쓰는 길이 열려 있습니다"
          else
            echo "$out" | tail -5
            echo "::error::VERCEL_ORG_ID · VERCEL_PROJECT_ID 의 짝이 안 맞습니다. 토큰은 '$who' 로 보이는데, 그 계정에 이 프로젝트가 없습니다"
            echo "::error::Vercel → 프로젝트 → Settings → General 맨 아래 'Project ID' 와, 계정/팀 Settings 의 ID 를 다시 확인해 주세요"
            exit 1
          fi
