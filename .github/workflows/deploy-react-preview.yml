name: Build and deploy React preview (v4)

# 2026-09-17 v4.0.0-alpha.1 React 전환 미리보기 — https://dev.moncamp.kr/react/
#
# 어디에 얹히나
#   dev 미리보기 저장소(MinsangKwak/pogo-rank-dev)의 gh-pages **하위 폴더 /react/** 에 넣는다.
#   루트(= v3 dev 미리보기)는 건드리지 않는다 — keep_files: true · force_orphan 없음.
#   저장소당 Pages 사이트가 하나라 별도 URL 을 쓰려면 저장소를 더 만들어야 해서, 한 사이트를 나눠 쓴다.
#
# 2026-09-17 dev 배포가 /react/ 를 지우던 문제는 없어졌다.
#   deploy-dev.yml 이 force_orphan: true 로 gh-pages 를 통째로 새로 쓰는데, 따로 올린 /react/ 가
#   그때 같이 지워져 손으로 다시 돌려야 했다. 이제 dev 배포가 **같은 판에서** v4 도 만들어
#   dist/react/ 로 넣고 한 번에 올린다 (deploy-dev.yml 의 'v4 미리보기 빌드' 단계).
#   이 워크플로는 dev 에 합치기 전의 react-change 작업분을 먼저 볼 때 쓴다 — keep_files: true 라 루트는 그대로 둔다.
#
# 왜 v3 빌드를 먼저 돌리나
#   전환 기간에는 데이터를 v3 번들에서 뽑아 쓴다 (frontend-v4/scripts/extract-data.mjs).
#   dist/data.js 가 있어야 JSON 을 가를 수 있다. Phase 1 을 정식으로 끝내면 build.py 가 바로 JSON 을 쓴다.

on:
  push:
    branches: [react-change]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-react
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_KEY != '' }}
    steps:
      - name: 배포 키 확인
        run: |
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::error::시크릿 DEV_DEPLOY_KEY 가 없습니다 (docs/OPERATIONS.md 1장)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v4/package-lock.json
      # 스프라이트·직전 정상본 캐시는 dev 워크플로와 같은 키 계열을 써서 서로 재사용한다
      - uses: actions/cache@v4
        with:
          path: |
            data/sprites
            data/sprites-anim
          key: sprites-v1-${{ github.run_id }}
          restore-keys: sprites-v1-
      - uses: actions/cache@v4
        with:
          path: snapshot/tables
          key: tables-v1-${{ github.run_id }}
          restore-keys: tables-v1-
      # **전체 빌드를 돌려야 한다.** backend/build.py 하나만으로는 data/ 의 표가 없어 선다
      # (첫 판에서 그렇게 넣었다가 실패했다 — scripts/build.sh 가 fetch → 계산 → 조립을 차례로 한다).
      # 미리보기가 쓰는 것은 그중 dist/data.js · dist/data-lazy.js 둘뿐이다
      - name: v3 빌드 (데이터를 여기서 얻는다)
        env:
          BUILD_CHANNEL: dev
          ADMIN_UID: ${{ vars.ADMIN_UID }}
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: bash scripts/build.sh
      - name: v4 빌드
        working-directory: frontend-v4
        run: |
          npm ci
          npm run build
      - name: Publish to pogo-rank-dev (gh-pages) /react/
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEV_DEPLOY_KEY }}
          external_repository: MinsangKwak/pogo-rank-dev
          publish_branch: gh-pages
          publish_dir: ./frontend-v4/dist
          destination_dir: react
          keep_files: true     # 루트의 v3 미리보기를 남긴다
          commit_message: "react preview ${{ github.sha }}"
