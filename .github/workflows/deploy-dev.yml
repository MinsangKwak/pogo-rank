name: Build and deploy dev preview

# 2026-09-05 v2.7.3 dev 브랜치 미리보기 배포 — https://minsangkwak.github.io/pogo-rank-dev/
# GitHub Pages 는 저장소당 사이트 하나라서, 별도 URL(pogo-rank-dev)은 같은 이름의 별도 저장소가 필요하다.
# 이 워크플로는 dev 브랜치를 BUILD_CHANNEL=dev 로 빌드해 MinsangKwak/pogo-rank-dev 의 gh-pages 브랜치에 밀어 넣고,
# 그 저장소의 Pages(소스: gh-pages)가 그대로 서빙한다. 실서비스 저장소 자체의 Pages 는 건드리지 않는다.
#
# 필요한 시크릿: DEV_DEPLOY_KEY — pogo-rank-dev 에 쓰기 권한이 있는 deploy key 의 개인키.
#   최초 1회 scripts/setup_dev_deploy_key.sh 를 실행하면 키 생성·등록·시크릿 저장이 한 번에 된다.
# dev 빌드는 GA 를 넣지 않고 robots/noindex 로 색인을 막는다 (backend/build.py BUILD_CHANNEL 참고).
# 순위 스냅샷(snapshot/) 커밋은 하지 않는다 — ▲▼ 기준은 main 에서 머지된 스냅샷을 그대로 쓴다.

on:
  push:
    branches: [dev]
  # 2026-09-10 v2.50.0 dev 도 매일 다시 빌드한다 — 알 부화 풀·레이드 보스는 게임 쪽에서 수시로 바뀌는데,
  # 푸시가 없으면 dev 미리보기는 마지막 푸시 날짜의 데이터에 머문다. 확인하러 들어온 사람이
  # "데이터가 안 바뀐다" 를 보게 되는데, 실제로는 배포가 아니라 빌드가 안 돈 것이다.
  # 실서비스(deploy.yml)보다 30분 늦게 돌려 같은 시각에 겹치지 않게 한다
  schedule:
    - cron: '30 15 * * *'   # 매일 00:30 KST (15:30 UTC)
    # 2026-09-20 v4.5.5 인기 검색어를 운영과 같은 박자로 — 미리보기가 한 판 뒤처지지 않게
    - cron: '30 3 * * *'    # 매일 12:30 KST (03:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_KEY != '' }}
    steps:
      - name: 배포 키 확인
        run: |
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::error::시크릿 DEV_DEPLOY_KEY 가 없습니다. 저장소 루트에서 bash scripts/setup_dev_deploy_key.sh 를 한 번 실행하세요 (docs/OPERATIONS.md 1장)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 2026-09-20 v4.5.0 스프라이트를 공식 일러스트로 바꾸며 축소(backend/sprites.py)에 Pillow 가 필요하다
      - run: pip install --quiet Pillow
      # v4 미리보기(/react/)를 같은 판에서 만들기 위해 (아래 'v4 미리보기' 단계)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v4/package-lock.json
      # 스프라이트 캐시는 실서비스 워크플로와 같은 키 계열을 써서 서로 재사용한다
      # 2026-09-12 v2.67.0 움직이는 그림(data/sprites-anim, 949장 51MB)도 같은 캐시에 —
      # 빼 두면 매 빌드가 51MB 를 다시 받고 없는 223종에 404 를 다시 묻는다
      - uses: actions/cache@v4
        with:
          path: |
            data/sprites
            data/sprites-anim
          key: sprites-v1-${{ github.run_id }}
          restore-keys: sprites-v1-
      # 2026-09-16 v3.47.0 직전 정상본 표 — 원본이 비거나 줄어든 날 이걸로 대체한다 (backend/guard.py).
      # 저장소에 커밋하지 않는다(1.6MB 가 매일 바뀐다). 캐시를 잃으면 폴백이 한 번 없을 뿐이고, 그때는 빌드가 멈춰 직전 배포가 남는다
      - uses: actions/cache@v4
        with:
          path: snapshot/tables
          key: tables-v1-${{ github.run_id }}
          restore-keys: tables-v1-
      - name: Build site (dev channel)
        env:
          BUILD_CHANNEL: dev
          # 운영 설정값은 실서비스와 같은 Repository variables 를 쓴다 (GA 는 dev 채널이라 어차피 안 들어감)
          GA_ID: G-1L6ENS8PVK   # 2026-09-14 v3.27.1 deploy.yml 과 같은 값 (dev 채널은 어차피 안 들어감) · 2026-09-15 v3.42.1 옛 스트림 삭제로 교체
          ADMIN_UID: ${{ vars.ADMIN_UID }}
          CONTACT_EMAIL: kmsdevwork@knou.ac.kr   # 2026-09-15 v3.32.0 학생 계정으로 교체. 저장소 변수 vars.CONTACT_EMAIL 은 더 읽지 않는다 (v3.27.1 GA_ID 와 같은 처리)
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: bash scripts/build.sh
      # 2026-09-20 v4.5.5 인기 검색어 — 운영과 같은 GA 속성을 읽는다.
      #   **dev 는 GA 로 아무것도 안 보낸다**(dev 채널에는 조각이 안 들어간다). 그래도 여기서 집계하는 이유는
      #   운영에 쌓인 수로 미리보기 화면을 먼저 확인하기 위해서다 — 시크릿이 제대로 붙었는지도 여기서 드러난다.
      #   시크릿이 없거나 GA 가 답을 안 주면 빈 표를 쓰고 넘어간다 (화면은 구역을 안 그린다)
      - name: 인기 검색어 집계
        continue-on-error: true
        env:
          GA_SA_JSON: ${{ secrets.GA_SA_JSON }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          # 표가 비면 실제 순위표 이름으로 채워 모양을 볼 수 있게 한다 (화면에 '미리보기 샘플' 딱지가 붙는다)
          BUILD_CHANNEL: dev
        run: |
          pip install --quiet google-auth requests
          python3 backend/hotsearch_build.py
      # 2026-09-17 v4 미리보기를 **같은 dist 안에** 넣어 한 번에 올린다.
      #   아래 발행은 force_orphan 이라 gh-pages 를 통째로 새로 쓴다 — 따로 올린 /react/ 는 그때 지워진다.
      #   실제로 dev 배포가 한 번 돌 때마다 미리보기가 사라져 손으로 다시 돌려야 했다.
      #   한 판에서 같이 만들어 한 번에 올리면 그 문제가 아예 없어진다 (경쟁도 없다).
      #   데이터는 방금 만든 dist/data.js 에서 뽑는다 (frontend-v4/scripts/extract-data.mjs)
      # 2026-09-17 **dev 미리보기는 통째로 v4 다.** 전에는 v3 가 루트, v4 가 /react/ 였는데
      #   한 사이트에 두 앱이 살면 "지금 보는 게 어느 쪽이지" 가 늘 따라다닌다.
      #
      #   v3 빌드는 그대로 돈다 — v4 가 그 산출물에서 데이터(dist/data.js)를 뽑아 쓰고,
      #   그림 2,000여 장도 거기서 가져온다. 올리는 것만 v4 쪽으로 바뀐 것이다.
      # **설치 실패와 검사 실패는 뜻이 다르다.**
      #   설치가 안 되면 그건 네트워크 사정이다 — v4 를 접고 v3 를 올려 화면을 지킨다.
      #   검사가 빨개지면 규칙이 틀린 것이다 — 그때는 **배포를 세운다.** 조용히 v3 로
      #   내려앉으면 잘못된 판을 막은 것이 아니라 아무도 모르게 되돌린 것이 된다.
      #   세워 두면 GitHub Pages 가 직전 정상 판을 계속 서빙한다.
      - name: v4 의존성 설치
        id: v4deps
        continue-on-error: true
        run: |
          set -e
          cd frontend-v4
          npm ci
      - name: v4 검사 (권한·잠금) — 빨개지면 배포를 세운다
        if: steps.v4deps.outcome == 'success'
        run: |
          set -e
          cd frontend-v4
          npm test
      - name: v4 빌드
        if: steps.v4deps.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_CHANNEL: dev
        run: |
          set -e
          cd frontend-v4
          npm run build
      # 올릴 폴더를 여기서 한 벌 만든다.
      #   v4 가 서면 그것을, 서다 말면 v3 를 올린다 — **어느 쪽이든 dev 가 깜깜해지지 않는다.**
      #   v4 는 v3 파일에 얹혀 살아서(CSS 23장 · dist/data.js · schedule.js) v3 쪽 이름만 바뀌어도 설 수 있다.
      - name: 올릴 폴더 꾸리기 (site/)
        run: |
          set -e
          rm -rf site
          if [ -f frontend-v4/dist/index.html ]; then
            cp -r frontend-v4/dist site
            echo "v4 를 올립니다"
          else
            cp -r dist site
            echo "::warning::v4 빌드가 서서 v3 를 대신 올립니다 — frontend-v4 를 확인하세요"
          fi
          # 그림과 부속 파일은 v3 빌드가 만든 것을 그대로 쓴다 (v4 는 아직 제 것을 안 만든다).
          # robots 는 dev 채널용 전면 차단본이라 반드시 따라와야 한다 — 미리보기가 색인되면 안 된다
          for keep in sprites sprites-anim robots.txt sitemap.xml 404.html build.json; do
            if [ -e "dist/$keep" ] && [ ! -e "site/$keep" ]; then cp -r "dist/$keep" "site/$keep"; fi
          done
          test -f site/index.html && test -f site/robots.txt
          # **차단본인지 제대로 본다.** 처음엔 'Disallow: /' 만 찾았는데, 운영본에도
          # 'Disallow: /data.js' 와 AI 크롤러용 'Disallow: /' 가 있어 그대로 통과했다 —
          # 운영 robots 가 미리보기에 실리면 dev 가 검색에 잡힌다.
          # dev 채널 robots 는 세 줄짜리 전면 차단본이고 'Allow:' 가 한 줄도 없다
          grep -q '색인 금지' site/robots.txt || { echo "::error::robots 가 dev 차단본이 아닙니다"; cat site/robots.txt; exit 1; }
          grep -q '^Allow:' site/robots.txt && { echo "::error::robots 에 Allow 가 있습니다 (운영본이 실렸습니다)"; exit 1; }
          # 2026-09-18 index.html 쪽도 본다 — robots.txt 만 막고 메타가 색인 허용이면 미리보기가 잡힌다
          # 낱말이 아니라 메타 태그를 본다 — 주석의 낱말로는 운영 빌드가 실려도 통과해 버린다 (deploy.yml 과 같은 패턴)
          if ! grep -q 'name="robots" content="noindex' site/index.html; then echo "::error::index.html 에 noindex 메타가 없습니다 (운영 빌드가 실렸습니다)"; exit 1; fi
          echo "robots 차단본 확인"
          # 그림이 통째로 빠지면 화면이 몬스터볼 자리표시로 도배된다 — 수로 확인한다
          test "$(ls site/sprites | wc -l)" -gt 500 || { echo "::error::스프라이트가 모자랍니다"; exit 1; }
      - name: Publish to pogo-rank-dev (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEV_DEPLOY_KEY }}
          external_repository: MinsangKwak/pogo-rank-dev
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true   # 미리보기 저장소에 히스토리를 쌓지 않는다 (매번 한 커밋)
          # 2026-09-14 v3.27.0 브랜치 배포라 gh-pages 루트의 CNAME 이 커스텀 도메인을 정한다 — force_orphan 이라 매 배포마다 다시 실려야 한다.
          # 실서비스(deploy.yml)는 actions/deploy-pages 라 CNAME 파일을 무시하고 저장소 Settings → Pages 값만 쓴다.
          cname: dev.moncamp.kr
          commit_message: "dev preview ${{ github.sha }}"
