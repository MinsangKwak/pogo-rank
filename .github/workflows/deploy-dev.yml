name: Build and deploy dev preview

# 2026-09-23 v5 Phase 7 — dev 는 Next.js 다 (dev-pipeline.yml).
#
# 전에는 frontend-v4(Vite)를 빌드해 pogo-rank-dev 저장소의 gh-pages 에 밀어 넣었다.
# 이제는 web/(Next.js)을 Vercel 의 moncamp-dev 프로젝트에 올리고 dev.moncamp.kr 을 그리로 돌린다.
# 옛 gh-pages 는 되돌릴 자리로 그대로 둔다 — DNS 를 되돌리면 옛 dev 가 다시 선다
# (docs/V5-CUTOVER.md 의 되돌리기).
#
# **매일 다시 굽는 것은 main 에 이 파일이 들어간 뒤부터다.** 예약 실행(schedule)은 기본 브랜치의
# 워크플로 파일로 돈다 — 그전까지는 main 의 옛 판이 옛 gh-pages 를 굽는다(아무도 안 보는 자리다).
on:
  push:
    branches: [dev]
  schedule:
    - cron: '30 15 * * *'   # 매일 00:30 KST — 게임 데이터(알 부화·레이드 보스)가 수시로 바뀐다
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  dev:
    uses: ./.github/workflows/dev-pipeline.yml
    with:
      attach_domain: true
      # **언제나 dev 를 굽는다.** 예약 실행은 기본 브랜치(main)에서 돌아 checkout 도 main 이 된다 —
      # 2026-09-25 00:30 KST 예약이 dev.moncamp.kr 을 main 의 옛 화면으로 덮었다(새 디자인이 사라졌다).
      # 이 줄은 main 에 들어가야 예약에도 먹힌다 — 예약은 main 의 이 파일로 돈다
      ref: dev
    secrets: inherit
