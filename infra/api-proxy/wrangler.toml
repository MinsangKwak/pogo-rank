# api.moncamp.kr → Cloud Run (worker.js 머리 주석 참고)
# ORIGIN_URL 은 여기 안 적는다 — 서버 배포가 끝난 뒤 Cloud Run 이 알려 주는 주소를
# 배포 워크플로가 `--var` 로 넘긴다. 적어 두면 서비스를 다시 만들 때 옛 주소를 가리킨다
name = "moncamp-api-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"
# *.workers.dev 주소를 열지 않는다 — 문이 둘이면 한쪽만 지킨다
workers_dev = false
# custom_domain 이면 Cloudflare 가 DNS 기록과 인증서를 같이 만든다. 손으로 DNS 를 안 만진다
routes = [ { pattern = "api.moncamp.kr", custom_domain = true } ]
